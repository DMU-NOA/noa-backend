# 워크플로우 이름
name: Deploy Backend

# ---------- 실행 조건 ----------
on:
  push:
    branches: [main]      # main 브랜치에 push(머지 포함)될 때마다 자동 실행

# ---------- 권한 설정 ----------
permissions:
  id-token: write         # GitHub OIDC 토큰 발급 허용
  contents: read          # 레포 코드를 읽기만 가능

# ---------- 동시 실행 제어 ----------
concurrency:
  group: deploy-backend   # 같은 그룹의 배포는 한 번에 하나씩만 실행
  cancel-in-progress: false   # 진행 중인 배포는 취소하지 않고, 새 배포는 앞 배포가 끝날 때까지 대기
                              # (배포 도중 중단되어 꼬이는 상태가 되는 것을 방지)

# ---------- 공통 환경변수 ----------
env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest    # GitHub가 제공하는 우분투 러너에서 실행
    steps:
      # 1. 레포 코드를 러너로 내려받기
      - uses: actions/checkout@v4

      # 2. OIDC로 AWS 자격 증명 획득
      #    - 액세스 키 대신 IAM Role을 임시로 위임받는 방식 (키 유출 위험 없음)
      #    - AWS_ROLE_ARN 은 GitHub Secrets 에 저장된 IAM Role
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. SSM으로 EC2에서 deploy.sh 실행
      - name: Deploy via SSM
        run: |
          # deploy.sh 를 base64 한 줄 문자열로 변환
          # (스크립트의 줄바꿈/따옴표가 JSON 파라미터를 깨뜨리지 않도록 인코딩해서 전달)
          SCRIPT_B64=$(base64 -w0 scripts/deploy.sh)

          # EC2에 명령 전송 후 COMMAND_ID 를 받아둠 (이후 결과 조회에 사용)
          #  - AWS-RunShellScript : SSM이 제공하는 쉘 스크립트 실행 문서
          #  - --comment          : SSM 콘솔에서 어떤 커밋의 배포인지 식별용
          #  - --timeout-seconds  : 600초(10분) 안에 못 끝나면 실패 처리
          #  - commands (2단계)
          #      1) base64 를 풀어서 /tmp/deploy.sh 로 저장
          #      2) ec2-user 권한으로 실행하며, 커밋 SHA 를 첫 번째 인자로 전달
          #         (deploy.sh 가 이 SHA 로 git reset --hard 해서 정확히 그 커밋을 배포)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend ${{ github.sha }}" \
            --timeout-seconds 600 \
            --parameters "commands=[\"echo $SCRIPT_B64 | base64 -d > /tmp/deploy.sh\",\"sudo -u ec2-user bash /tmp/deploy.sh ${{ github.sha }}\"]" \
            --query "Command.CommandId" --output text)

          # 명령이 끝날 때까지 대기
          # || true : 대기가 타임아웃/실패해도 스크립트를 멈추지 않고, 아래에서 상태를 직접 확인
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          # 최종 실행 상태 조회 (Success / Failed / TimedOut 등)
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)

          # deploy.sh 의 출력(stdout)과 에러(stderr)를 Actions 로그에 출력
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "[StandardOutputContent, StandardErrorContent]" \
            --output text

          # Success 가 아니면 워크플로우를 실패 처리 (빨간 X 표시, exit 1)
          [ "$STATUS" = "Success" ] || { echo "Deploy failed: $STATUS"; exit 1; }