<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOA | 나의 서울 여행 취향</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#193b37;background:#f3f7f5}*{box-sizing:border-box}body{margin:0;padding:28px 16px}.wrap{max-width:720px;margin:30px auto}.eyebrow{color:#157d6d;font-weight:700;letter-spacing:.13em}h1{font-size:clamp(28px,5vw,44px);line-height:1.16;margin:12px 0}.sub{color:#58706c;line-height:1.6}.panel{background:white;border-radius:25px;padding:clamp(22px,5vw,42px);box-shadow:0 15px 45px #193b3710;margin-top:30px} .bar{height:8px;background:#e7efeb;border-radius:10px;overflow:hidden}.fill{height:100%;background:#159a83;transition:width .25s}.count{color:#157d6d;font-weight:700;margin-top:28px}h2{font-size:26px;margin:10px 0 25px}.choices{display:grid;gap:14px}button{font:inherit;cursor:pointer}.choice{padding:24px;border:2px solid #dce9e3;background:#f8fbf9;border-radius:16px;text-align:left;font-size:18px;font-weight:650;color:#193b37;transition:.2s}.choice:hover,.choice:focus-visible{border-color:#159a83;background:#ebf8f3;transform:translateY(-2px)}.back,.restart{border:0;background:none;color:#157d6d;font-weight:700;margin-top:24px;padding:8px 0}.card{padding:18px 0;border-top:1px solid #e8eee9}.card h3{margin:0 0 5px}.card p{margin:5px 0;color:#58706c}.tag{display:inline-block;background:#e9f7f1;border-radius:20px;padding:5px 10px;margin:8px 5px 0 0;color:#117c68;font-size:13px}.note{font-size:14px;color:#697e78;line-height:1.6}.error{color:#bb3939}.hidden{display:none}
</style></head>
<body><main class="wrap"><div class="eyebrow">NOA · SEOUL TRAVEL</div><h1>나에게 맞는 서울,<br>어디로 떠날까?</h1><p class="sub">여섯 번의 선택으로 여행 취향에 맞는 장소를 찾아보세요.</p><section class="panel" aria-live="polite"><div class="bar"><div class="fill" id="fill"></div></div><div id="game"><p class="count" id="count"></p><h2 id="title"></h2><div class="choices" id="choices"></div><button class="back hidden" id="back" type="button">← 이전 질문</button></div><div id="result" class="hidden"></div></section></main>
<script>
let questions=[], answers=[], step=0;
const $=id=>document.getElementById(id);
async function init(){try{const response=await fetch('/api/game/questions');if(!response.ok)throw Error('질문을 불러오지 못했습니다.');questions=await response.json();draw()}catch(e){$('game').textContent=e.message}}
function draw(){ $('result').classList.add('hidden');$('game').classList.remove('hidden');$('fill').style.width=(step/questions.length*100)+'%';$('count').textContent=`QUESTION ${step+1} / ${questions.length}`;$('title').textContent=questions[step].title;$('choices').replaceChildren(); questions[step].choices.forEach((label,index)=>{let button=document.createElement('button');button.className='choice';button.type='button';button.textContent=label;button.onclick=()=>{answers[step]=index;step++;step===questions.length?finish():draw()};$('choices').append(button)});$('back').classList.toggle('hidden',step===0)}
$('back').onclick=()=>{step--;draw()};
async function finish(){ $('fill').style.width='100%';$('game').classList.add('hidden');$('result').classList.remove('hidden');$('result').textContent='취향에 맞는 장소를 찾고 있습니다…';try{let response=await fetch('/api/game/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({choices:answers})});let data=await response.json();if(!response.ok)throw Error(data.detail||'추천을 불러오지 못했습니다.');render(data)}catch(e){$('result').replaceChildren();let p=document.createElement('p');p.className='error';p.textContent=e.message;$('result').append(p, restartButton())}}
function restartButton(){let button=document.createElement('button');button.className='restart';button.textContent='다시 시작하기 →';button.onclick=()=>{answers=[];step=0;draw()};return button}
function render(data){let root=$('result');root.replaceChildren();let heading=document.createElement('h2');heading.textContent='당신을 위한 서울 여행지';root.append(heading);let note=document.createElement('p');note.className='note';note.textContent=data.demo?'예시 장소로 보여주는 데모 결과입니다. 실제 관광지 DB를 연결하면 DB 장소를 추천합니다.':data.message;root.append(note);if(!data.recommendations.length){let p=document.createElement('p');p.textContent='일치하는 장소가 없습니다. 다른 선택으로 다시 시도해 보세요.';root.append(p)}data.recommendations.forEach((spot,i)=>{let article=document.createElement('article');article.className='card';let h=document.createElement('h3');h.textContent=`${i+1}. ${spot.name}`;let address=document.createElement('p');address.textContent=spot.address;article.append(h,address);spot.matched_tags.forEach(tag=>{let span=document.createElement('span');span.className='tag';span.textContent='#'+tag;article.append(span)});root.append(article)});root.append(restartButton())}
init();
</script></body></html>
